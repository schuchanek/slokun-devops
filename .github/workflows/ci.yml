name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend tests and build
    runs-on: ubuntu-latest
    if: ${{ hashFiles('backend/package.json') != '' || hashFiles('backend/pnpm-lock.yaml') != '' || hashFiles('backend/yarn.lock') != '' || hashFiles('backend/go.mod') != '' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Checkout backend repository
        uses: actions/checkout@v4
        with:
          repository: schuchanek/slokun-backend
          path: backend

      - name: Set up Node
        if: ${{ hashFiles('backend/package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        if: ${{ hashFiles('backend/package.json') != '' }}
        run: |
          cd backend
          npm ci

      - name: Build backend
        if: ${{ hashFiles('backend/package.json') != '' }}
        run: |
          cd backend
          npm run build

      - name: Test backend
        if: ${{ hashFiles('backend/package.json') != '' }}
        run: |
          cd backend
          if npm run | grep -q "test"; then npm test -- --runInBand; fi

      - name: Set up Go
        if: ${{ hashFiles('backend/go.mod') != '' }}
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Go backend
        if: ${{ hashFiles('backend/go.mod') != '' }}
        run: |
          cd backend
          go test ./...
          go build ./...

      - name: Login to GitHub Container Registry
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend docker image
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/slokun-backend:latest

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    if: ${{ hashFiles('frontend/pubspec.yaml') != '' || hashFiles('frontend/package.json') != '' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Checkout frontend repo
        uses: actions/checkout@v4
        with:
          repository: schuchanek/slokun-frontend
          path: frontend

      - name: Setup Flutter
        if: ${{ hashFiles('frontend/pubspec.yaml') != '' }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'

      - name: Install frontend dependencies
        if: ${{ hashFiles('frontend/pubspec.yaml') != '' }}
        run: |
          cd frontend
          flutter pub get

      - name: Test Flutter frontend
        if: ${{ hashFiles('frontend/pubspec.yaml') != '' }}
        run: |
          cd frontend
          flutter test

      - name: Build Flutter web app
        if: ${{ hashFiles('frontend/pubspec.yaml') != '' }}
        run: |
          cd frontend
          flutter build web --release

      - name: Set up Node for web app
        if: ${{ hashFiles('frontend/package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install web frontend dependencies
        if: ${{ hashFiles('frontend/package.json') != '' }}
        run: |
          cd frontend
          npm ci

      - name: Build frontend app
        if: ${{ hashFiles('frontend/package.json') != '' }}
        run: |
          cd frontend
          npm run build

      - name: Login to GitHub Container Registry
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build frontend docker image
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/slokun-frontend:latest

  docker-compose-check:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose -f docker-compose.yml config
