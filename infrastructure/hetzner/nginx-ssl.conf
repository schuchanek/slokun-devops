server {
    listen 80;
    server_name api.slokun.eu;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.slokun.eu;

    ssl_certificate     /etc/letsencrypt/live/api.slokun.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.slokun.eu/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 80;
    server_name business.slokun.eu;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name business.slokun.eu;

    ssl_certificate     /etc/letsencrypt/live/business.slokun.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/business.slokun.eu/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
